name: "spoken-english-assessment"
title: "儿童英语口语测评"
description: "Turn a child's English speaking recording or video into a one-page A4 parent report by default: native listening (two passes over the audio) for pronunciation, fluency and intonation, a six-dimension rubric aligned to IELTS/Cambridge Starters/CEFR with red-flower banding instead of scores, optional teacher's note, six macaron colour themes, and the full transcript. The local acoustic pipeline (Whisper + Parakeet + Praat) and the two-page detailed report are used only when reproducible measurements or an offline route are explicitly requested."
category: "Work and knowledge"
include_in_prompt: true
