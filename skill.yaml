name: "spoken-english-assessment"
title: "儿童英语口语测评"
description: "Turn a child's English speaking recording or video into a one-page A4 parent report by default: native listening (two passes over the audio) for pronunciation, fluency and intonation, a six-dimension rubric aligned to IELTS/Cambridge Starters/CEFR with red-flower banding instead of scores, a teacher's note as a sticky card beside the radar (written by the AI from this assessment, signed with the name the teacher gives), six macaron colour themes, and a bottom illustration drawn from the child's own recording waveform. Every report also comes as an editable PPTX (one locked background picture plus real text boxes) for teachers to adjust in PowerPoint, WPS or Keynote; the report fonts are fetched by scripts/download_fonts.py (Google Fonts, OFL) and shipped inside the distributed zip (not in git); scripts/install_fonts.py installs them on macOS or Windows. The local acoustic pipeline (Whisper + Parakeet + Praat) and the two-page detailed report are used only when reproducible measurements or an offline route are explicitly requested."
category: "Work and knowledge"
include_in_prompt: true
